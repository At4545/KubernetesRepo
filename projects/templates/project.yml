apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/At4545/KubernetesRepo.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
